[package]
name = "liseuse"
description = "Ma Liseuse : la bibliothèque et la Kindle de Maman"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
liseuse-core = { path = "../core" }
