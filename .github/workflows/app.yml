# Windows app: every push and PR runs the whole safety net.
# Releasing (docs/RELEASING.md): when main carries a version that has no
# tag yet (a merged version bump), or a tag vX.Y.Z is pushed, the installer
# is built signed and published as the Latest release (Mom's app installs it
# at its next start), only if every check below is green (the release job
# `needs` all of them; the live catalogue check is informative only, so a
# server outage never blocks a fix).
name: app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", ".github/**"]
  pull_request:
    paths: ["app/**", ".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  # never cancel a run on main or a tag: it may be publishing a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

jobs:
  version:
    name: Release needed?
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Tag to publish (empty when nothing to release)
        run: |
          node scripts/check-version.mjs
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] \
               && [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

  policy:
    name: Dependabot merge policy (self-test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/dependabot-merge.sh self-test

  core:
    name: Rust core (format, lint, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }
      - run: cargo fmt --all --check
      - run: cargo clippy -p liseuse-core --all-targets --locked -- -D warnings
      - run: cargo test -p liseuse-core --locked

  ui:
    name: UI + converter (unit, contract, end-to-end journeys)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run check:version
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Screenshots for review
        if: always()
        run: npm run screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: screenshots, path: app/e2e/screenshots/, retention-days: 14 }

  windows:
    name: Windows (core tests on NTFS + installer)
    needs: [version, core, ui]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }
      - run: cargo test -p liseuse-core --locked
      - run: npm ci --ignore-scripts
      - name: Assemble the web view (the shell embeds dist/ at compile time)
        run: npm run build:ui
      - run: cargo clippy -p liseuse --locked -- -D warnings
      - name: Build the installer (signed for the updater when releasing)
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.version.outputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.version.outputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY missing: a release must be signed"; exit 1; }
            npx tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --ci
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: |
            app/target/release/bundle/nsis/*.exe
            app/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 30

  live:
    # Not needed to publish: the real server may be down without the app
    # being wrong. Shows whether "Trouver un livre" works against it today
    # (search, pages, one real download; never sends a book request).
    name: Live catalogue (livres.hosh.it)
    needs: [windows]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }
      - run: npm ci --ignore-scripts
      - name: Assemble the web view (the shell embeds dist/ at compile time)
        run: npm run build:ui
      - run: cargo test -p liseuse --locked -- --ignored live

  release:
    name: Publish release
    if: needs.version.outputs.tag != ''
    needs: [version, policy, core, ui, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-version.mjs "${{ needs.version.outputs.tag }}"
      - uses: actions/download-artifact@v8
        with: { name: installer-windows, path: dist-release }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd ..
          node app/scripts/updater-manifest.mjs dist-release "$TAG" "${GITHUB_REPOSITORY}"
          (cd dist-release && sha256sum *.exe > SHA256SUMS.txt)
          # One channel (owner's decision, 2026-11-01): a new release is
          # marked Latest at once, so Mom's app installs it at its next start.
          # Roll back by marking the previous release Latest (docs/RELEASING.md).
          # The tag is created here, on the commit that passed every check.
          gh release create "$TAG" dist-release/* --latest --target "$GITHUB_SHA" --title "Ma liseuse $TAG" --notes-file app/CHANGELOG.md
