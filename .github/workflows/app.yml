# Windows app: every push and PR runs the whole safety net. A tag vX.Y.Z
# builds the installer and publishes a GitHub release, but only if every
# check below is green (the release job `needs` all of them).
name: app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", ".github/**"]
  pull_request:
    paths: ["app/**", ".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: app

jobs:
  policy:
    name: Dependabot merge policy (self-test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/dependabot-merge.sh self-test

  core:
    name: Rust core (format, lint, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }
      - run: cargo fmt --all --check
      - run: cargo clippy -p liseuse-core --all-targets --locked -- -D warnings
      - run: cargo test -p liseuse-core --locked

  ui:
    name: UI + converter (unit, contract, end-to-end journeys)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run check:version
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Screenshots for review
        if: always()
        run: npm run screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: app/e2e/screenshots/, retention-days: 14 }

  windows:
    name: Windows (core tests on NTFS + installer)
    needs: [core, ui]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }
      - run: cargo test -p liseuse-core --locked
      - run: npm ci --ignore-scripts
      - name: Assemble the web view (the shell embeds dist/ at compile time)
        run: npm run build:ui
      - run: cargo clippy -p liseuse --locked -- -D warnings
      - run: npx tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: app/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [policy, core, ui, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with: { name: installer-windows, path: dist-release }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          sha256sum dist-release/*.exe > dist-release/SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" dist-release/* --title "Ma liseuse ${GITHUB_REF_NAME}" --notes-file app/CHANGELOG.md --verify-tag
