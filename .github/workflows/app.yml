# Windows app: every push and PR runs the whole safety net. A tag vX.Y.Z
# builds the installer and publishes a GitHub release, but only if every
# check below is green (the release job `needs` all of them).
name: app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", ".github/**"]
  pull_request:
    paths: ["app/**", ".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: app

jobs:
  policy:
    name: Dependabot merge policy (self-test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/dependabot-merge.sh self-test

  core:
    name: Rust core (format, lint, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }
      - run: cargo fmt --all --check
      - run: cargo clippy -p liseuse-core --all-targets --locked -- -D warnings
      - run: cargo test -p liseuse-core --locked

  ui:
    name: UI + converter (unit, contract, end-to-end journeys)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run check:version
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Screenshots for review
        if: always()
        run: npm run screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: screenshots, path: app/e2e/screenshots/, retention-days: 14 }

  windows:
    name: Windows (core tests on NTFS + installer)
    needs: [core, ui]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }
      - run: cargo test -p liseuse-core --locked
      - run: npm ci --ignore-scripts
      - name: Assemble the web view (the shell embeds dist/ at compile time)
        run: npm run build:ui
      - run: cargo clippy -p liseuse --locked -- -D warnings
      - name: Build the installer (signed for the updater on release tags)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY missing: a release must be signed"; exit 1; }
            npx tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --ci
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: |
            app/target/release/bundle/nsis/*.exe
            app/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [policy, core, ui, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v8
        with: { name: installer-windows, path: dist-release }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          node app/scripts/updater-manifest.mjs dist-release "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}"
          (cd dist-release && sha256sum *.exe > SHA256SUMS.txt)
          # A new release is the "test" channel (pre-release): Mom's app only
          # follows the release marked "Latest". Promote it there by hand once
          # it ran on your PC; roll back by marking the previous one Latest.
          gh release create "${GITHUB_REF_NAME}" dist-release/* --prerelease --title "Ma liseuse ${GITHUB_REF_NAME}" --notes-file app/CHANGELOG.md --verify-tag
